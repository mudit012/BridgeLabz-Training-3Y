<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q1 - Welcome Greeting</title>
<link rel="stylesheet" href="../style.css">
<style>#greeting{font-size:2rem}</style>
</head>
<body>
<header><h1>Welcome Page</h1></header>
<main>
  <section class="card">
    <h2 id="greeting" title="Click me">Hello!</h2>
    <label for="username">Your name:</label>
    <input id="username" type="text" placeholder="Guest">
    <button id="setName">Set name</button>
    <p id="welcomeMsg">Welcome to our website. We are glad you are here!</p>
    <button id="changeGreeting">Change Greeting</button>
    <button id="toggleWelcome">Toggle Welcome Message</button>
  </section>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="q1.js"></script>
</body>
</html>
