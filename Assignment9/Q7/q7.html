<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q7 - Search Courses</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header><h1>Search Courses</h1></header>
<main>
  <section class="card">
    <label for="search">Search:</label>
    <input id="search" type="search" placeholder="Type a course name...">
    <button id="clear">Clear</button>
    <p id="count" aria-live="polite"></p>
  </section>
  <ul id="courses">
    <li class="course">JavaScript Fundamentals</li>
    <li class="course">jQuery for Beginners</li>
    <li class="course">Python for Data Science</li>
    <li class="course">Java Programming</li>
    <li class="course">HTML and CSS Mastery</li>
    <li class="course">React Basics</li>
  </ul>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="q7.js"></script>
</body>
</html>
