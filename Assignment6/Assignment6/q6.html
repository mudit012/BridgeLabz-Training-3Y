<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Q6 - Fake Store Product Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
    h2 { text-align: center; }
    #products { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    .card { background: white; padding: 12px; border-radius: 8px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    .card img { height: 120px; max-width: 100%; object-fit: contain; }
    .title { font-size: 13px; font-weight: bold; }
    .price { color: #00796b; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Fake Store - Product Dashboard</h2>
  <div id="products">Loading...</div>
  <script src="q6.js"></script>
</body>
</html>
