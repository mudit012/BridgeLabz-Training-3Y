<html lang="en">
    <head>
        <style>
            *{
                padding: 0;
                box-sizing: border-box;
            }
            .box{
                display: grid;
                /* grid-template-columns: 100px 150px 100px; */
                grid-template-columns: 1fr 1fr 1fr;
                

                grid-gap : 10px;

            }
            .item{
                background-color: rgb(0, 145, 234);
                border: 1px solid rgb(0, 0, 0);
                padding : 1rem;
            }
            .item1{
                grid-column: 1/3;
                grid-row: 1/3;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <div class="item item1">1</div>
            <div align="center" class="item">2</div>
            <div align ="right" class="item">3</div>
            <div class="item">4</div>
            <div align ="center" class="item">5</div>
            <div  align ="right" class="item">6</div>
        </div>
    </body>
</html>
