<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Q8 - Dynamic Object Updater</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Edit User</h2>
  <form id="userForm">
    <label>Name</label>
    <input type="text" id="name">
    <label>Email</label>
    <input type="email" id="email">
    <label>Age</label>
    <input type="number" id="age">
    <button type="submit">Update</button>
  </form>

  <div class="box">
    <h3>Current user object</h3>
    <pre id="display"></pre>
  </div>
  <script src="q8.js"></script>
</body>
</html>
