<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Q9 - Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #aaa; padding: 6px; text-align: left; }
  </style>
</head>
<body>
  <h2>Shopping Cart</h2>
  <form id="itemForm">
    <label>Item name</label>
    <input type="text" id="itemName" required>
    <label>Price</label>
    <input type="number" id="itemPrice" min="1" required>
    <label>Quantity</label>
    <input type="number" id="itemQty" min="1" value="1" required>
    <button type="submit">Add to Cart</button>
  </form>

  <table>
    <thead><tr><th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th></tr></thead>
    <tbody id="cartBody"></tbody>
  </table>
  <p><b>Total: Rs. <span id="total">0.00</span></b></p>

  <label>Coupon code (e.g. SAVE20, DISC10)</label>
  <input type="text" id="coupon">
  <button id="applyCoupon">Apply Coupon</button>
  <div class="error" id="couponMsg"></div>
  <p id="finalBox" class="success"></p>
  <script src="q9.js"></script>
</body>
</html>
