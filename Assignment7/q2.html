<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Q2 - Character Counter</title>
  <link rel="stylesheet" href="style.css">
  <style>
    textarea { width: 100%; height: 120px; box-sizing: border-box; }
    #counter { font-weight: bold; color: green; }
    #counter.warning { color: #d4a900; }  /* yellow-ish */
    #counter.danger { color: red; }
  </style>
</head>
<body>
  <h2>Live Character Counter</h2>
  <textarea id="text" placeholder="Type here (max 100 characters)"></textarea>
  <p>Remaining: <span id="counter">100</span></p>
  <button id="resetBtn">Reset</button>
  <script src="q2.js"></script>
</body>
</html>
