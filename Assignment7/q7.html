<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Q7 - Mouse Logger</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #box {
      width: 400px; height: 400px; border: 2px solid #333;
      position: relative; background: #f5f5f5; cursor: crosshair;
    }
    .dot {
      width: 10px; height: 10px; background: red; border-radius: 50%;
      position: absolute; transform: translate(-50%, -50%); /* centre the dot on the click */
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h2>Mouse Path & Coordinates Logger</h2>
  <p id="coords">clientX: -, clientY: -</p>
  <p>Double-click inside the box to drop a red dot.</p>
  <div id="box"></div>
  <script src="q7.js"></script>
</body>
</html>
