<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Q5 - Image Gallery</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { max-width: 700px; }
    #gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    #gallery img { width: 100%; height: 130px; object-fit: cover; cursor: pointer; border-radius: 4px; }
    #gallery img:hover { opacity: 0.8; }

    #overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); justify-content: center; align-items: center;
    }
    #modal { background: white; padding: 10px; border-radius: 6px; max-width: 90%; }
    #modal img { max-width: 100%; max-height: 80vh; display: block; }
  </style>
</head>
<body>
  <h2>Image Gallery</h2>
  <div id="gallery">
    <img src="https://picsum.photos/id/10/800/600" alt="Image 1">
    <img src="https://picsum.photos/id/20/800/600" alt="Image 2">
    <img src="https://picsum.photos/id/30/800/600" alt="Image 3">
    <img src="https://picsum.photos/id/40/800/600" alt="Image 4">
    <img src="https://picsum.photos/id/50/800/600" alt="Image 5">
    <img src="https://picsum.photos/id/60/800/600" alt="Image 6">
  </div>

  <div id="overlay">
    <div id="modal">
      <img id="bigImage" src="" alt="">
    </div>
  </div>
  <script src="q5.js"></script>
</body>
</html>
