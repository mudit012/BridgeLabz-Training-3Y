<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Q4 - Theme Switcher</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { transition: 0.3s; }
    body.theme-light { background: #ffffff; color: #222; }
    body.theme-dark  { background: #1e1e1e; color: #f1f1f1; }
    body.theme-blue  { background: #d6e9ff; color: #0b3d91; }
  </style>
</head>
<body class="theme-light" data-theme="light">
  <h2>Theme Switcher</h2>
  <p>Click a button to change the theme of this page.</p>
  <button data-theme-btn="light">Light</button>
  <button data-theme-btn="dark">Dark</button>
  <button data-theme-btn="blue">Blue</button>
  <p id="current">Current theme: light</p>
  <script src="q4.js"></script>
</body>
</html>
